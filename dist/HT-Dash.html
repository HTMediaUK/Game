<script>
"use strict";
// ---------------------------------------------------------------------------
// HT Dash: HT Media's expo stand game.
// Plain JavaScript, no engine, no internet needed. Open index.html in Chrome.
//   Left / Right        choose a runner on the title screen
//   Space               start, and jump (tap for a hop, hold for a big jump)
//   Enter               save your name at the end of a run
//   F                   full screen
//   Ctrl+Alt+R          clear the high score table (asks first)
// Collect a pie to jump twice as high for 10 seconds (and bounce off things you land on).
// High scores are saved in this browser on this laptop (localStorage).
// ---------------------------------------------------------------------------

const W = 320, H = 180, GROUND_Y = 148;
const STORE_KEY = "ht-dans-dash-highscores";
const MAX_SCORES = 10, MAX_NAME = 12;
const NAME_TIMEOUT_MS = 60000;          // abandon name entry after a minute idle

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let S = 1;                               // integer scale from 320x180 to the screen

function resize() {
  S = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  canvas.width = W * S;
  canvas.height = H * S;
}
addEventListener("resize", resize);
resize();

// ----------------------------------------------------------------- assets
const IMG = {};
const ASSETS = {
  sky: "sprites/backdrop/sky.png",
  clouds: "sprites/backdrop/clouds.png",
  ground: "sprites/backdrop/ground.png",
  tripod: "sprites/obstacles/tripod.png",
  flight_case: "sprites/obstacles/flight_case.png",
  flight_cases_stacked: "sprites/obstacles/flight_cases_stacked.png",
  roadblock_0: "sprites/obstacles/roadblock_0.png",
  roadblock_1: "sprites/obstacles/roadblock_1.png",
  sheep_0: "sprites/obstacles/sheep_0.png",
  sheep_1: "sprites/obstacles/sheep_1.png",
  cow_0: "sprites/obstacles/cow_0.png",
  cow_1: "sprites/obstacles/cow_1.png",
  pie: "sprites/landmarks/pie.png",
  seagull_0: "sprites/obstacles/seagull_0.png",
  seagull_1: "sprites/obstacles/seagull_1.png",
  drone_0: "sprites/obstacles/drone_0.png",
  drone_1: "sprites/obstacles/drone_1.png",
  cape_run_0: "sprites/landmarks/cape_run_0.png",
  cape_run_1: "sprites/landmarks/cape_run_1.png",
  cape_up: "sprites/landmarks/cape_up.png",
  cape_down: "sprites/landmarks/cape_down.png",
  plane: "sprites/landmarks/plane.png",
};
// The HT team. Dan is the default runner; the arrow keys on the title screen pick someone else.
const CHARS = [
  { id: "dan",   name: "DAN",   role: "Managing Director" },
  { id: "mark",  name: "MARK",  role: "Creative Director" },
  { id: "beth",  name: "BETH",  role: "Operations & Creative Coordinator" },
  { id: "sam",   name: "SAM",   role: "Editor" },
  { id: "jonas", name: "JONAS", role: "Creative Producer" },
];
let sel = 0;                      // which runner is chosen
const who = () => CHARS[sel];
const RUN_FRAMES = 6;
for (const c of CHARS) {
  for (const f of ["stand", "jump_up", "jump_down", "land", ...[0, 1, 2, 3, 4, 5].map(i => "run_" + i)]) {
    ASSETS[`${c.id}_${f}`] = `sprites/characters/${c.id}/${f}.png`;
  }
}
for (let i = 0; i < 4; i++) {
  ASSETS["far_" + i] = `sprites/backdrop/hills_far_${i}.png`;
  ASSETS["mid_" + i] = `sprites/backdrop/hills_mid_${i}.png`;
}
function loadAll() {
  return Promise.all(Object.entries(ASSETS).map(([k, src]) => new Promise((ok, fail) => {
    const im = new Image();
    im.onload = () => { IMG[k] = im; ok(); };
    im.onerror = () => fail(new Error("Missing image: " + src));
    im.src = (window.EMBED && window.EMBED[src]) || src;   // the single-file build carries its images inside
  })));
}

// Obstacles: frames, how often they appear, and when (seconds into a run) they start.
const OBSTACLES = [
  { name: "tripod",               frames: ["tripod"],               weight: 3, from: 0 },
  { name: "flight_case",          frames: ["flight_case"],          weight: 3, from: 0 },
  { name: "sheep",                frames: ["sheep_0", "sheep_1"],   weight: 3, from: 0,   walk: 0.4 },
  { name: "flight_cases_stacked", frames: ["flight_cases_stacked"], weight: 2, from: 10 },
  { name: "cow",                  frames: ["cow_0", "cow_1"],       weight: 2, from: 8, walk: 0.25 },
  { name: "roadblock",            frames: ["roadblock_0", "roadblock_1"], weight: 2, from: 20, blink: 24 },
  // seagulls fly towards Dan: low ones at chest height (jump over them),
  // high ones at jump height (don't jump, or just tap for a small hop)
  { name: "gull_low",  frames: ["seagull_0", "seagull_1"], weight: 2, from: 15, walk: 1.0, air: GROUND_Y - 24 },
  { name: "gull_high", frames: ["seagull_0", "seagull_1"], weight: 2, from: 22, walk: 1.0, air: 80 },
  // drones hover towards Dan more slowly, bobbing up and down as they come
  { name: "drone_low",  frames: ["drone_0", "drone_1"], weight: 2, from: 18, walk: 0.3, air: GROUND_Y - 22, bob: 3, spin: 3 },
  { name: "drone_high", frames: ["drone_0", "drone_1"], weight: 2, from: 28, walk: 0.3, air: 81, bob: 2, spin: 3 },
];

// ----------------------------------------------------------------- high scores
function loadScores() {
  try {
    const list = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    return Array.isArray(list) ? list : [];
  } catch { return []; }
}
function saveScore(name, score, runner) {
  const list = loadScores();
  const entry = { name, score, runner, at: Date.now() };
  list.push(entry);
  list.sort((a, b) => b.score - a.score || a.at - b.at);
  const top = list.slice(0, MAX_SCORES);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(top)); } catch { /* storage blocked */ }
  return top.indexOf(entry);   // -1 if it didn't make the table
}
function bestScore() {
  const list = loadScores();
  return list.length ? list[0].score : 0;
}

// ----------------------------------------------------------------- game state
let state = "title";            // title | play | crash | name | board
let t = 0;                      // frames since the page started
let speed, distance, score, obstacles, nextGap, dan, crashAt, nameText, nameSince, boardRank, boardSince;
let jumpHeld = false;
let runClock = 0, landTimer = 0;   // run animation and the squash after landing
let bufferedAt = -99;              // Space pressed just before landing still counts
let runTime = 0;                   // frames since this run started (60 a second)
let wind = [];                     // faint streaks that rush past once the run speeds up
let take = 1;                      // today's take number, shown on the high score slate

// Difficulty rises with time, not distance, so every run is over in about a minute:
//   0-15s gentle, ground only | 15s seagulls | 25s close pairs, fewer pies
//   40s no more pies | 50s+ speed keeps climbing past what people can react to
function secs() { return runTime / 60; }
function difficulty() { return Math.min(1, secs() / 50); }
let pies = [], pieGap = 0, power = 0, pieFlash = 0;
const POWER_FRAMES = 600;        // pie power lasts 10 seconds

function newRun() {
  speed = 2.4;
  distance = 0;
  score = 0;
  obstacles = [];
  nextGap = 140;
  dan = { x: 50, y: GROUND_Y - 30, vy: 0, onGround: true };
  pies = [];
  pieGap = 700 + Math.random() * 500;
  runTime = 0;
  wind = [];
  take = nextTake();
  power = 0;
  pieFlash = 0;
  state = "play";
}

function jump() {
  if (dan.onGround) {
    dan.vy = power > 0 ? -7.5 : -5.3;   // pie power: twice as high
    dan.onGround = false;
  }
}

function spawn() {
  const pool = OBSTACLES.filter(o => secs() >= o.from);
  let r = Math.random() * pool.reduce((s, o) => s + o.weight, 0);
  let kind = pool.find(o => (r -= o.weight) < 0) || pool[0];
  // a high seagull never arrives on top of a ground obstacle: you couldn't hop under it and over that
  const high = k => k.air !== undefined && k.air < 100;
  if (high(kind) && obstacles.some(o => !o.kind.air && o.x > W - 110)) {
    kind = pool.find(o => !o.air) || pool[0];
  }
  const im = IMG[kind.frames[0]];
  const y = kind.air !== undefined ? kind.air : GROUND_Y - im.height + 1;
  obstacles.push({ kind, x: W + 4, y, baseY: y, w: im.width, h: im.height, phase: Math.random() * 100 });
  // gap grows with speed so jumps stay possible, but shrinks as the run goes on
  nextGap = (110 + Math.random() * 130) * (0.7 + speed / 6) * (1 - 0.4 * difficulty());
  // from 25 seconds, sometimes a second ground obstacle follows close behind:
  // clear both with one long, held jump
  if (secs() > 25 && !kind.air && Math.random() < 0.15 + 0.25 * difficulty()) {
    const twin = OBSTACLES.filter(o => !o.air && o.name !== "roadblock" && secs() >= o.from);
    const k2 = twin[Math.floor(Math.random() * twin.length)];
    const im2 = IMG[k2.frames[0]];
    obstacles.push({ kind: k2, x: W + 4 + im.width + 18 + speed * 4, y: GROUND_Y - im2.height + 1, w: im2.width, h: im2.height });
    nextGap += 60;
  }
  if (high(kind)) nextGap += 70;   // room to land after hopping under it
  if (power > 0) nextGap *= 1.7;   // super jumps hang longer, so leave room to land
}

function hit(o) {
  // forgiving hitboxes: Dan's body and the obstacle shrunk a little
  const dx0 = dan.x + 10, dx1 = dan.x + 22, dy0 = dan.y + 4, dy1 = dan.y + 29;
  const ox0 = o.x + 3, ox1 = o.x + o.w - 3, oy0 = o.y + 3, oy1 = o.y + o.h;
  return dx0 < ox1 && dx1 > ox0 && dy0 < oy1 && dy1 > oy0;
}

// Which go this is today, for the "TAKE" box on the clapperboard.
const TAKE_KEY = "ht-dans-dash-takes";
function today() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
}
function nextTake() {
  let rec = { date: today(), n: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(TAKE_KEY) || "null");
    if (saved && saved.date === rec.date) rec = saved;
  } catch { /* storage blocked */ }
  rec.n++;
  try { localStorage.setItem(TAKE_KEY, JSON.stringify(rec)); } catch { /* storage blocked */ }
  return rec.n;
}

function update() {
  t++;
  if (state === "title" || state === "board") {
    distance = (distance || 0) + 1.5;   // backdrop keeps scrolling behind the menus
  }
  if (state === "board" && performance.now() - boardSince > 15000) { state = "title"; sel = 0; }
  if (state === "name" && performance.now() - nameSince > NAME_TIMEOUT_MS) { state = "title"; sel = 0; obstacles = []; }
  if (state === "crash" && performance.now() - crashAt > 900) {
    state = "name";
    obstacles = [];
    wind = [];
    nameText = "";
    nameSince = performance.now();
  }
  if (state !== "play") return;

  runTime++;
  // speed: 2.6 at the start, about 7 at 50 seconds, then it keeps on climbing
  speed = 2.6 + 4.4 * Math.pow(difficulty(), 1.3) + Math.max(0, secs() - 50) * 0.12;
  distance += speed;
  score = Math.floor(distance / 10);

  // Jump easing: float up while Space is held (let go early for a short hop),
  // hang for a moment at the top, then fall a little quicker than the rise.
  if (!dan.onGround) {
    let g = dan.vy < 0 ? (jumpHeld ? 0.26 : 0.65) : 0.36;
    if (Math.abs(dan.vy) < 1) g *= 0.45;
    dan.vy = Math.min(dan.vy + g, 6.5);
    dan.y += dan.vy;
    if (dan.y >= GROUND_Y - 30) {
      dan.y = GROUND_Y - 30; dan.vy = 0; dan.onGround = true; landTimer = 6;
      if (t - bufferedAt <= 8 && jumpHeld) jump();   // pressed just before landing
    }
  }

  // wind: nothing at the start, then faint streaks that build as the speed climbs
  const gust = Math.max(0, Math.min(1, (speed - 3.6) / 3));
  if (Math.random() < gust * 0.45) {
    wind.push({ x: W + Math.random() * 20, y: 14 + Math.random() * 118,
                len: 6 + Math.random() * 10 + gust * 10, vx: speed * 2.4 + 2 + Math.random() * 2,
                a: 0.07 + 0.16 * gust * Math.random() + 0.05 });
  }
  for (const w of wind) w.x -= w.vx;
  wind = wind.filter(w => w.x + w.len > 0);

  // about 10 frames a second, picking up gently to about 14 at top speed
  if (dan.onGround) runClock += 0.16 * Math.sqrt(speed / 2.4);
  if (landTimer > 0) landTimer--;

  nextGap -= speed;
  if (nextGap <= 0) spawn();

  // pies float at jump height, in gaps between obstacles
  pieGap -= speed;
  if (pieGap <= 0 && secs() < 40 && !obstacles.some(o => o.x > W - 70)) {
    pies.push({ x: W + 4, y: GROUND_Y - 64 });
    pieGap = (1100 + Math.random() * 900) * (1 + 1.5 * difficulty());   // rarer as the run goes on
  }
  for (const p of pies) p.x -= speed;
  pies = pies.filter(p => {
    const got = dan.x + 22 > p.x + 2 && dan.x + 10 < p.x + 16 && dan.y + 4 < p.y + 14 && dan.y + 29 > p.y + 2;
    if (got) { power = POWER_FRAMES; pieFlash = 70; }
    return !got && p.x > -20;
  });
  if (power > 0) power--;
  if (pieFlash > 0) pieFlash--;
  for (const o of obstacles) {
    o.x -= speed + (o.kind.walk || 0);
    if (o.kind.bob) o.y = o.baseY + Math.round(Math.sin((t + o.phase) / 12) * o.kind.bob);
  }
  obstacles = obstacles.filter(o => o.x + o.w > -4);

  for (const o of obstacles) {
    if (!hit(o)) continue;
    // with pie power, coming down on top of something bounces Dan off it
    const feetBefore = dan.y + 29 - dan.vy;
    if (power > 0 && dan.vy > 0 && feetBefore <= o.y + 6) {
      dan.y = o.y - 30;
      dan.vy = -4.2;
      continue;
    }
    state = "crash";
    crashAt = performance.now();
    break;
  }
}

// ----------------------------------------------------------------- drawing
function tileLayer(img, offset) {
  const o = Math.floor(offset) % W;
  ctx.drawImage(img, -o, 0);
  ctx.drawImage(img, W - o, 0);
}

function text(str, x, y, size, colour = "#fff", align = "center") {
  ctx.font = `bold ${size}px ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(18,14,23,0.85)";
  ctx.fillText(str, x + 0.75, y + 0.75);   // drop shadow
  ctx.fillStyle = colour;
  ctx.fillText(str, x, y);
}

function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(18,14,23,0.82)";
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "#f29a4a";
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

// A golden silhouette of a Dan frame, used for the pie-power glow (made once per frame image).
const glowCache = new Map();
function glowOf(img) {
  if (!glowCache.has(img)) {
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    const g = c.getContext("2d");
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = "source-in";
    g.fillStyle = "#ffd98a";
    g.fillRect(0, 0, c.width, c.height);
    glowCache.set(img, c);
  }
  return glowCache.get(img);
}

// Title screen: the whole team stands on the grass; the chosen runner jogs on the spot and glows.
function drawLineup() {
  CHARS.forEach((c, i) => {
    const x = 20 + i * 60, y = GROUND_Y - 30;
    const chosen = i === sel;
    const img = chosen ? IMG[c.id + "_run_" + Math.floor(t / 6) % RUN_FRAMES] : IMG[c.id + "_stand"];
    if (chosen) {
      ctx.globalAlpha = 0.55 + 0.2 * Math.sin(t / 8);
      const glow = glowOf(img);
      for (const [gx, gy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) ctx.drawImage(glow, x + gx, y + gy);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#f29a4a";                         // little arrow over their head
      for (let k = 0; k < 4; k++) ctx.fillRect(x + 12 + k, y - 9 + k, 8 - 2 * k, 1);
    }
    ctx.drawImage(img, x, y);
    // name and role on a little plate under each person
    const cx = x + 16;
    ctx.fillStyle = chosen ? "rgba(18,14,23,0.85)" : "rgba(18,14,23,0.6)";
    ctx.fillRect(cx - 28, 151, 56, 28);
    if (chosen) { ctx.fillStyle = "#f29a4a"; ctx.fillRect(cx - 28, 151, 56, 1); }
    text(c.name, cx, 157, 7, chosen ? "#f29a4a" : "#fff");
    wrap(c.role, 13).forEach((line, j) => text(line, cx, 165 + j * 5, 4.5, "#ffe2b0"));
  });
}

// Split a role into short lines so it fits under a character.
function wrap(str, max) {
  const lines = [];
  for (const word of str.split(" ")) {
    const last = lines[lines.length - 1];
    if (last && (last + " " + word).length <= max) lines[lines.length - 1] = last + " " + word;
    else lines.push(word);
  }
  return lines;
}

function drawWorld() {
  const turbine = Math.floor(t / 6) % 4;
  ctx.drawImage(IMG.sky, 0, 0);
  tileLayer(IMG.clouds, t * 0.1 + distance * 0.05);
  // the small white plane crosses the sky every so often
  const px = (t * 0.35) % (W + 600) - 40;
  if (px < W + 10) ctx.drawImage(IMG.plane, Math.round(px), Math.round(38 + Math.sin(t / 40) * 2));
  tileLayer(IMG["far_" + turbine], distance * 0.1);
  tileLayer(IMG["mid_" + turbine], distance * 0.3);
  tileLayer(IMG.ground, distance);

  for (const w of wind) {
    ctx.fillStyle = `rgba(255,255,255,${w.a.toFixed(3)})`;
    ctx.fillRect(Math.round(w.x), Math.round(w.y), Math.round(w.len), 1);
  }
  for (const p of (state === "play" || state === "crash") ? pies : []) {
    ctx.drawImage(IMG.pie, Math.round(p.x), Math.round(p.y + Math.sin(t / 10) * 1.5));
  }
  for (const o of obstacles || []) {
    const f = o.kind.frames;
    const im = IMG[f[Math.floor(t / (o.kind.blink || o.kind.spin || 10)) % f.length]];
    ctx.drawImage(im, Math.round(o.x), o.y);
  }

  // Dan
  if (state === "title") { drawLineup(); return; }
  const menu = state === "board" || state === "name";
  const d = menu ? { x: 18, y: GROUND_Y - 30, onGround: true } : dan;
  const id = who().id;
  let danImg = IMG[id + "_stand"];
  if (state === "play") {
    if (!d.onGround) danImg = d.vy < 0 ? IMG[id + "_jump_up"] : IMG[id + "_jump_down"];   // fist up, then arms out
    else if (landTimer > 0) danImg = IMG[id + "_land"];
    else danImg = IMG[id + "_run_" + Math.floor(runClock) % RUN_FRAMES];
  } else if (state === "board") {
    danImg = IMG[id + "_run_" + Math.floor(t / 6) % RUN_FRAMES];
  }
  if (power > 0 && (state === "play" || state === "crash") && (power > 120 || Math.floor(t / 6) % 2)) {
    // superhero cape while pie power lasts (it flickers in the last two seconds)
    const cape = !d.onGround ? (d.vy < 0 ? IMG.cape_up : IMG.cape_down) : IMG["cape_run_" + Math.floor(t / 6) % 2];
    ctx.drawImage(cape, Math.round(d.x - 6), Math.round(d.y + 5));
  }
  if (power > 0 && (state === "play" || state === "crash")) {
    // subtle golden glow round Dan while he's super, gently pulsing
    ctx.globalAlpha = 0.35 + 0.15 * Math.sin(t / 8);
    const glow = glowOf(danImg);
    for (const [gx, gy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) ctx.drawImage(glow, Math.round(d.x) + gx, Math.round(d.y) + gy);
    ctx.globalAlpha = 1;
  }
  ctx.drawImage(danImg, Math.round(d.x), Math.round(d.y));
}

function drawHud() {
  if (power > 0) {
    // pie power timer, top left
    // pie power timer, top centre (clear of the drone and the score)
    ctx.drawImage(IMG.pie, W / 2 - 38, 4);
    ctx.fillStyle = "rgba(18,14,23,0.8)";
    ctx.fillRect(W / 2 - 18, 9, 52, 7);
    ctx.fillStyle = power < 120 && Math.floor(t / 8) % 2 ? "#fff" : "#e8a24a";
    ctx.fillRect(W / 2 - 17, 10, Math.ceil(50 * power / POWER_FRAMES), 5);
  }
  if (pieFlash > 0) text("PIE POWER! SUPER JUMP!", W / 2, 50, 10, "#ffd98a");
  text(`SCORE ${String(score).padStart(5, "0")}`, W - 6, 10, 8, "#fff", "right");
  text(`BEST ${String(Math.max(bestScore(), score)).padStart(5, "0")}`, W - 6, 20, 7, "#ffe2b0", "right");
}

// ----------------------------------------------------------------- clapperboard
const CHALK = "#f2efe6", SLATE = "#1d1b22", CHALK_DIM = "#8f8a99";
let stripeCache = null;
function stripes(w, h) {
  // black and white diagonal blocks, like the top of a film clapper
  if (stripeCache && stripeCache.width === w && stripeCache.height === h) return stripeCache;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) {
    g.fillStyle = Math.floor((x + y) / 8) % 2 ? "#f4f4f4" : "#16141a";
    g.fillRect(x, y, 1, 1);
  }
  stripeCache = c;
  return c;
}

function label(str, x, y) {
  ctx.font = 'bold 5px ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace';
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillStyle = CHALK_DIM;
  ctx.fillText(str, x, y);
}

function chalkLine(x0, y0, x1, y1) {
  ctx.fillStyle = CHALK;
  if (y0 === y1) ctx.fillRect(x0, y0, x1 - x0, 1);
  else ctx.fillRect(x0, y0, 1, y1 - y0);
}

// Slate with its striped clapper. `clap` runs from 0 (open) to 1 (snapped shut).
function slate(x, y, w, h, clap) {
  ctx.fillStyle = "rgba(18,14,23,0.45)";
  ctx.fillRect(x + 3, y + 12, w, h - 9);              // drop shadow
  ctx.fillStyle = SLATE;
  ctx.fillRect(x, y + 9, w, h - 9);                    // the board
  ctx.drawImage(stripes(w, 8), x, y + 10);             // fixed striped bar
  ctx.save();                                          // hinged clapper stick
  ctx.translate(x, y + 9);
  ctx.rotate(-0.5 * (1 - clap));
  ctx.drawImage(stripes(w, 8), 0, -9);
  ctx.restore();
  ctx.fillStyle = "#8f8a99";
  ctx.fillRect(x, y + 1, 4, 17);                       // hinge
  ctx.strokeStyle = CHALK;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 3.5, y + 21.5, w - 7, h - 25);    // chalk frame
}


function drawScoreSlate() {
  const x = 66, w = 188, h = 150, y = 6;
  slate(x, y, w, h, 1);
  const L = x + 4, R = x + w - 4, top = y + 22;
  label(`TAKE ${take}`, L + 3, top + 2);
  text(boardRank >= 0 ? `You're number ${boardRank + 1}!` : "Nice try!", W / 2, top + 11, 10, "#ffd98a");
  chalkLine(L, top + 19, R);
  label("HIGH SCORES", L + 3, top + 22);
  drawTable(x + 44, top + 33, boardRank);
  if (Math.floor(t / 30) % 2 === 0) text("PRESS SPACE TO PLAY AGAIN", W / 2, 168, 8, "#fff");
}

function drawTable(x, y, highlight) {
  const list = loadScores();
  if (!list.length) {
    text("No scores yet. Be the first!", W / 2, y + 20, 7, "#ffe2b0");
    return;
  }
  list.forEach((e, i) => {
    const row = y + i * 9;
    const colour = i === highlight ? "#f29a4a" : "#fff";
    text(`${String(i + 1).padStart(2, " ")}.`, x, row, 7, colour, "right");
    text(e.name, x + 6, row, 7, colour, "left");
    text(String(e.score), x + 120, row, 7, colour, "right");
  });
}

function draw() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = false;
  drawWorld();

  if (state === "play" || state === "crash") drawHud();

  if (state === "crash") {
    text("YA BUGGER!", W / 2, 60, 18, "#ff6b6b");
  }

  if (state === "title") {
    panel(70, 6, 180, 52);
    text("HT DASH", W / 2, 19, 16, "#f29a4a");
    text("an HT Media game", W / 2, 32, 7, "#ffe2b0");
    const top = loadScores()[0];
    text(top ? `BEST: ${top.name} ${top.score}` : "No scores yet. Be the first!", W / 2, 46, 7, "#fff");
    text("CHOOSE YOUR RUNNER", W / 2, 70, 9, "#fff");
    text("LEFT / RIGHT: CHOOSE      SPACE: PLAY", W / 2, 82, 7, "#ffe2b0");
  }

  if (state === "name") {
    panel(60, 30, 200, 96);
    text("GAME OVER", W / 2, 44, 14, "#f29a4a");
    text(`You scored ${score}`, W / 2, 60, 9, "#fff");
    text("Type your name for the high scores:", W / 2, 76, 7, "#ffe2b0");
    ctx.fillStyle = "#fff";
    ctx.fillRect(90, 84, 140, 16);
    ctx.fillStyle = "#120e17";
    ctx.fillRect(91, 85, 138, 14);
    const cursor = Math.floor(t / 20) % 2 === 0 ? "_" : " ";
    text(nameText + cursor, W / 2, 92.5, 9, "#fff");
    text("Press ENTER to save", W / 2, 112, 7, nameText.trim() ? "#fff" : "#8a8494");
  }
  if (state === "board") drawScoreSlate();
}

// ----------------------------------------------------------------- input
function pressStart() {
  if (state === "title") { newRun(); jumpHeld = false; }
  else if (state === "board") { sel = 0; state = "title"; }       // Dan is the default again
  else if (state === "play") { jumpHeld = true; if (!dan.onGround) bufferedAt = t; jump(); }
}

addEventListener("keydown", e => {
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "r") {
    if (confirm("Clear the whole high score table?")) localStorage.removeItem(STORE_KEY);
    return;
  }
  if (state === "name") {
    nameSince = performance.now();
    if (e.key === "Enter" && nameText.trim()) {
      boardRank = saveScore(nameText.trim(), score, who().id);
      obstacles = [];
      boardSince = performance.now();
      state = "board";
    } else if (e.key === "Backspace") {
      nameText = nameText.slice(0, -1);
    } else if (e.key.length === 1 && /[a-z0-9 .'-]/i.test(e.key) && nameText.length < MAX_NAME) {
      nameText += e.key.toUpperCase();
    }
    e.preventDefault();
    return;
  }
  if (e.key === "f" || e.key === "F") {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
    return;
  }
  if (state === "title" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {   // pick a runner
    e.preventDefault();
    sel = (sel + (e.key === "ArrowRight" ? 1 : CHARS.length - 1)) % CHARS.length;
    return;
  }
  if (e.key === " " && !e.repeat) {
    e.preventDefault();
    pressStart();
  }
});
addEventListener("keyup", e => {
  if (e.key === " ") jumpHeld = false;
});
// The game is played with Space only. A click just gives the page keyboard focus.
canvas.addEventListener("pointerdown", () => canvas.focus());

// ----------------------------------------------------------------- main loop
// Fixed 60 updates a second, whatever the screen's refresh rate.
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(250, now - last);
  last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(frame);
}

loadAll().then(() => {
  distance = 0; score = 0; obstacles = [];
  requestAnimationFrame(frame);
}).catch(err => {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  text(err.message, W / 2, H / 2, 7, "#ff6b6b");
});
</script>
</body>
