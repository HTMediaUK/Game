<script>
"use strict";
// ---------------------------------------------------------------------------
// HT Dash: HT Media's expo stand game.
// Plain JavaScript, no engine, no internet needed. Open index.html in Chrome.
//   Left / Right        choose a runner on the title screen
//   Space               start, and jump (tap for a hop, hold for a big jump)
//   Enter               save your name at the end of a run
//   F                   full screen
//   Ctrl+Alt+S          settings (title screen): save location, download entries, reset high scores
//   Ctrl+Alt+E          download every entry (name, work email, score) as a CSV
//   Ctrl+Alt+B          choose (or reconnect) the Notepad backup file, rewritten after every entry
// Collect a pie to jump twice as high for 10 seconds (and bounce off things you land on).
// High scores are saved in this browser on this laptop (localStorage).
// ---------------------------------------------------------------------------

const W = 320, H = 180, GROUND_Y = 148;
const STORE_KEY = "ht-dans-dash-highscores";
const MAX_SCORES = 10, MAX_NAME = 12;
const NAME_TIMEOUT_MS = 60000;          // abandon name entry after a minute idle

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let S = 1;                               // integer scale from 320x180 to the screen

// Fill the screen: the game is 320 wide; on screens squarer than 16:9 (an iPad is 4:3) the view
// grows taller, the world sits in the middle, and the sky and ground carry on above and below.
// VIEW_H is the visible height and OFF_Y where the 180-tall world starts within it.
let VIEW_H = H, OFF_Y = 0, UI_SHIFT = 0;
function resize() {
  const fit = Math.min(innerWidth / W, innerHeight / H);
  VIEW_H = innerWidth / innerHeight < W / H ? Math.round(H * (innerHeight / H) / (innerWidth / W)) : H;
  VIEW_H = Math.min(VIEW_H, 260);                       // very tall screens get small bars instead
  OFF_Y = VIEW_H - H;                                   // all the extra height goes to the sky
  UI_SHIFT = Math.round((VIEW_H - H) / 2);              // menus move up to sit centred on screen
  const scale = Math.min(innerWidth / W, innerHeight / VIEW_H);
  S = Math.max(1, Math.ceil(scale));                     // draw crisp at a whole-number scale...
  canvas.width = W * S;
  canvas.height = VIEW_H * S;
  canvas.style.width = Math.floor(W * scale) + "px";     // ...then stretch to fill the screen
  canvas.style.height = Math.floor(VIEW_H * scale) + "px";
}

// On taller screens, carry the sky up into the extra height and float a second layer of
// clouds through it, so the space above reads as open sky rather than an empty band.
function extendWorld() {
  if (OFF_Y <= 0) return;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(canvas, 0, OFF_Y * S, W * S, S, 0, 0, W * S, OFF_Y * S);   // the sky's top colour
  ctx.setTransform(S, 0, 0, S, 0, OFF_Y * S);
  ctx.beginPath(); ctx.rect(0, -OFF_Y, W, OFF_Y); ctx.clip();
  if (OFF_Y >= 20) {
    const o = Math.floor(t * 0.03 + distance * 0.012 + 140) % W;           // higher clouds drift slower
    ctx.globalAlpha = 0.85;
    ctx.drawImage(IMG.clouds, -o, -OFF_Y - 6);
    ctx.drawImage(IMG.clouds, W - o, -OFF_Y - 6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// Draw something pinned to the real top of the screen rather than to the world.
function atScreenTop(fn) {
  ctx.save();
  ctx.setTransform(S, 0, 0, S, 0, 0);
  fn();
  ctx.restore();
}

// Draw menus and cards centred on the screen rather than on the world.
function centred(fn) {
  ctx.save();
  ctx.translate(0, -UI_SHIFT);
  fn();
  ctx.restore();
}
addEventListener("resize", resize);
resize();

// ----------------------------------------------------------------- high scores
function loadScores() {
  try {
    const list = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    return Array.isArray(list) ? list : [];
  } catch { return []; }
}
function saveScore(name, score, runner) {
  const list = loadScores();
  const entry = { name, score, runner, at: Date.now() };
  list.push(entry);
  list.sort((a, b) => b.score - a.score || a.at - b.at);
  const top = list.slice(0, MAX_SCORES);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(top)); } catch { /* storage blocked */ }
  return top.indexOf(entry);   // -1 if it didn't make the table
}
// Every entry (name, work email, score, runner, time) is kept here, on this laptop,
// separate from the top-10 table. It survives refreshing, closing Chrome and restarting.
const SUB_KEY = "ht-dash-submissions";
function loadSubmissions() {
  try {
    const list = JSON.parse(localStorage.getItem(SUB_KEY) || "[]");
    return Array.isArray(list) ? list : [];
  } catch { return []; }
}
function saveSubmission(entry) {

// ---- Notepad backup: a .txt file, chosen once, rewritten with every entry after each new one.
// Browsers only write to a file the person has picked, so staff press Ctrl+Alt+B to choose it.
// The choice is remembered (IndexedDB); after a refresh Chrome may need Ctrl+Alt+B once to allow it again.
let backupHandle = null, backupState = "off", backupAt = null;   // off | on | reconnect | unsupported | error
const BACKUP_DB = "ht-dash-backup";
function backupDb() {
  return new Promise((ok, fail) => {
    const req = indexedDB.open(BACKUP_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore("handles");
    req.onsuccess = () => ok(req.result);
    req.onerror = () => fail(req.error);
  });
}
async function rememberHandle(h) {
  try {
    const db = await backupDb();
    db.transaction("handles", "readwrite").objectStore("handles").put(h, "notepad");
  } catch { /* the backup still works this session */ }
}
async function recallHandle() {
  try {
    const db = await backupDb();
    return await new Promise(ok => {
      const r = db.transaction("handles").objectStore("handles").get("notepad");
      r.onsuccess = () => ok(r.result || null);
      r.onerror = () => ok(null);
    });
  } catch { return null; }
}
function notepadText() {
  const lines = ["HT Dash entries", "Date        Time   | Name | Work email | Score", ""];
  for (const s of loadSubmissions()) {
    const d = new Date(s.at);
    lines.push(`${d.toLocaleDateString("en-GB")}  ${d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}  |  ${s.name}  |  ${s.email}  |  ${s.score}`);
  }
  return lines.join("\r\n") + "\r\n";
}
async function writeBackup() {
  if (!backupHandle) return;
  try {
    if (backupHandle.queryPermission && (await backupHandle.queryPermission({ mode: "readwrite" })) !== "granted") {
      backupState = "reconnect";
      return;
    }
    const w = await backupHandle.createWritable();
    await w.write(notepadText());
    await w.close();
    backupState = "on";
    backupAt = new Date();
  } catch {
    backupState = "error";
  }
}
async function connectBackup() {                     // Ctrl+Alt+B (needs the key press to ask)
  try {
    if (backupHandle && backupState === "reconnect" && backupHandle.requestPermission) {
      if ((await backupHandle.requestPermission({ mode: "readwrite" })) === "granted") return writeBackup();
    }
    if (!window.showSaveFilePicker) { backupState = "unsupported"; return; }
    backupHandle = await window.showSaveFilePicker({
      suggestedName: "HT-Dash-entries.txt",
      types: [{ description: "Notepad text", accept: { "text/plain": [".txt"] } }],
    });
    await rememberHandle(backupHandle);
    await writeBackup();
  } catch { /* cancelled */ }
}
async function restoreBackup() {                     // on load: pick up last session's file if allowed
  if (!window.showSaveFilePicker) { backupState = "unsupported"; return; }   // iPad, Safari, Firefox
  backupHandle = await recallHandle();
  if (!backupHandle) return;
  try {
    const perm = backupHandle.queryPermission ? await backupHandle.queryPermission({ mode: "readwrite" }) : "granted";
    backupState = perm === "granted" ? "on" : "reconnect";
  } catch { backupState = "reconnect"; }
}

function exportSubmissions() {
  const rows = [["Name", "Work email", "Score", "Runner", "Date", "Time"]];
  for (const s of loadSubmissions()) {
    const d = new Date(s.at);
    rows.push([s.name, s.email, s.score, s.runner,
      d.toLocaleDateString("en-GB"), d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })]);
  }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" }));
  a.download = `ht-dash-entries-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

function bestScore() {

// ----------------------------------------------------------------- game state
let state = "title";            // title | play | crash | name | board | settings
let t = 0;                      // frames since the page started
let speed, distance, score, obstacles, nextGap, dan, crashAt, nameText, nameSince, boardRank, boardSince;
let emailText = "", field = "name", emailError = false;   // end card: name, then work email
const MAX_EMAIL = 48;
const EMAIL_OK = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
let jumpHeld = false;
let runClock = 0, landTimer = 0;   // run animation and the squash after landing
let bufferedAt = -99;              // Space pressed just before landing still counts
let runTime = 0;                   // frames since this run started (60 a second)
let wind = [];                     // faint streaks that rush past once the run speeds up
let bonus = 0, popups = [];        // +5 for landing on top of an obstacle, and the floating "+5"
let stomps = 0;                    // each +5 takes the next HT colour
// the brighter HT logo colours, in ring order (the darkest ones get lost against the sky)
const STOMP_COLOURS = ["#c49782", "#66bfad", "#d97e30", "#c45b66", "#9dbc3e", "#e1a22e",
  "#47984a", "#e5c41f", "#b85895", "#138aa8", "#8883b5", "#b2383e"];
let zoneStarts = null;             // per layer: where (in its own scroll) each next area's piece begins
let take = 1;                      // today's take number, shown on the high score slate

// Difficulty rises with time, not distance, so every run is over in about a minute. The
// speed stays calm (it tops out at 50 seconds); it's the obstacles that build up:
//   0-15s gentle, ground only | 15s seagulls and drones | 20s close pairs, fewer pies
//   40s groups of three, no more pies | 50s+ obstacles come thick and fast
function secs() { return runTime / 60; }
// The world runs through three areas: countryside, then a port at 15 seconds, then a Scottish
// canal at 30. Each new area arrives as part of the world: its in-between piece is lined up just
// off the right edge on each layer's own tile boundary, so it scrolls in at that layer's speed.
const ZONES = ["country", "port", "canal"];
const ZONE_AT = [15, 30];
// Gentle parallax: the background moves much less than the ground, to keep motion calm.
const LAYER_SPEED = { far: 0.06, mid: 0.18, ground: 1 };
// The near layer starts its change a little early so each new area arrives with the ground.
// (The far distance moves too slowly to scroll a change in, so it fades between areas instead.)
const ZONE_LEAD = { mid: 7, ground: 0 };
function startNextZone(name) {
  const list = zoneStarts[name];
  const at = Math.ceil((Math.floor(distance * LAYER_SPEED[name]) + W) / W) * W;
  list.push(list.length ? Math.max(at, list[list.length - 1] + 2 * W) : at);   // a full stretch of each area
}
function scheduleZones() {
  if (!zoneStarts) zoneStarts = { mid: [], ground: [] };
  for (const name of Object.keys(ZONE_LEAD)) {
    const list = zoneStarts[name];
    while (list.length < ZONE_AT.length && secs() >= ZONE_AT[list.length] - ZONE_LEAD[name]) startNextZone(name);
  }
}
function groundZone() {    // which area has reached the point where obstacles appear?
  if (!zoneStarts) return 0;
  const g = Math.floor(distance) + W;
  return zoneStarts.ground.filter(s => g >= s + W / 2).length;
}
function inZone(o) { return !o.zone || o.zone.includes(ZONES[groundZone()]); }
function difficulty() { return Math.min(1, secs() / 50); }
let pies = [], pieGap = 0, power = 0, pieFlash = 0;
const POWER_FRAMES = 600;        // pie power lasts 10 seconds

function newRun() {
  speed = 2.4;
  distance = 0;
  score = 0;
  obstacles = [];
  nextGap = 140;
  dan = { x: 50, y: GROUND_Y - 30, vy: 0, onGround: true };
  pies = [];
  pieGap = 700 + Math.random() * 500;
  runTime = 0;
  wind = [];
  bonus = 0; popups = []; zoneStarts = null; stomps = 0;
  lives = LIVES; invuln = 0;
  take = nextTake();
  power = 0;
  pieFlash = 0;
  state = "play";
}

function jump() {
  if (dan.onGround) {
    dan.vy = (power > 0 ? -7.5 : -5.3) * jumpMul();   // pie power: twice as high; jump stat on top
    dan.onGround = false;
  }
}

function spawn() {
  const pool = OBSTACLES.filter(o => secs() >= o.from && inZone(o));
  let r = Math.random() * pool.reduce((s, o) => s + o.weight, 0);
  let kind = pool.find(o => (r -= o.weight) < 0) || pool[0];
  // a high seagull never arrives on top of a ground obstacle: you couldn't hop under it and over that
  const high = k => k.air !== undefined && k.air < 100;
  if (high(kind) && obstacles.some(o => !o.kind.air && o.x > W - 110)) {
    kind = pool.find(o => !o.air) || pool[0];
  }
  const im = IMG[kind.frames[0]];
  const y = kind.air !== undefined ? kind.air : GROUND_Y - im.height + 1;
  obstacles.push({ kind, x: W + 4, y, baseY: y, w: im.width, h: im.height, phase: Math.random() * 100 });
  // more and more obstacles as the run goes on: the gaps tighten steadily, and after
  // 50 seconds they come thick and fast
  nextGap = (110 + Math.random() * 130) * (0.7 + speed / 6) * (1 - 0.45 * difficulty()) * (secs() > 50 ? 0.6 : 1);
  // groups: from 20 seconds a second ground obstacle can follow close behind (one long held
  // jump clears both, or hop along the tops for +5s); from 40 seconds sometimes a third
  if (secs() > 20 && !kind.air && Math.random() < 0.15 + 0.35 * difficulty() + (secs() > 50 ? 0.2 : 0)) {
    const pool2 = OBSTACLES.filter(o => !o.air && o.name !== "roadblock" && secs() >= o.from && inZone(o));
    let x = W + 4 + im.width;
    const extra = secs() > 40 && Math.random() < (secs() > 50 ? 0.5 : 0.3) ? 2 : 1;
    for (let n = 0; n < extra; n++) {
      const k2 = pool2[Math.floor(Math.random() * pool2.length)];
      const im2 = IMG[k2.frames[0]];
      x += 18 + speed * 4;
      obstacles.push({ kind: k2, x, y: GROUND_Y - im2.height + 1, w: im2.width, h: im2.height });
      x += im2.width;
      nextGap += 60;
    }
  }
  if (high(kind)) nextGap += 70;   // room to land after hopping under it
  if (power > 0) nextGap *= 1.7;   // super jumps hang longer, so leave room to land
}

function hit(o) {
  // forgiving hitboxes: Dan's body and the obstacle shrunk a little
  const dx0 = dan.x + 10, dx1 = dan.x + 22, dy0 = dan.y + 4, dy1 = dan.y + 29;
  const ox0 = o.x + 3, ox1 = o.x + o.w - 3, oy0 = o.y + 3, oy1 = o.y + o.h;
  return dx0 < ox1 && dx1 > ox0 && dy0 < oy1 && dy1 > oy0;
}

// Which go this is today, for the "TAKE" box on the clapperboard.
const TAKE_KEY = "ht-dans-dash-takes";
function today() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
}
function nextTake() {
  let rec = { date: today(), n: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(TAKE_KEY) || "null");
    if (saved && saved.date === rec.date) rec = saved;
  } catch { /* storage blocked */ }
  rec.n++;
  try { localStorage.setItem(TAKE_KEY, JSON.stringify(rec)); } catch { /* storage blocked */ }
  return rec.n;
}

function update() {
  t++;
  if (state === "title" || state === "board") {
    distance = (distance || 0) + 1.5;   // backdrop keeps scrolling behind the menus
  }
  if (state === "board" && performance.now() - boardSince > 15000) { state = "title"; sel = 0; }
  if (state === "name" && performance.now() - nameSince > NAME_TIMEOUT_MS) { state = "title"; sel = 0; obstacles = []; hideTyper(); }
  if (state === "crash" && performance.now() - crashAt > 900) {
    state = "name";
    obstacles = [];
    wind = [];
    nameText = "";
    emailText = ""; field = "name"; emailError = false;
    nameSince = performance.now();
  }
  if (state !== "play") return;

  runTime++;
  // speed: 2.6 at the start, about 7 at 50 seconds, then it keeps on climbing
  // calm speed: 2.2 at the start, easing up to 3.8 at 50 seconds, then it stays there;
  // runs end because the obstacles get closer together, not because the world races
  speed = (2.2 + 1.6 * Math.pow(difficulty(), 1.1)) * speedMul();
  if (invuln > 0) invuln--;
  distance += speed;
  score = Math.floor(distance / 10) + bonus;
  scheduleZones();
  for (const p of popups) { p.y -= 0.4; p.t--; }
  popups = popups.filter(p => p.t > 0);

  // Jump easing: float up while Space is held (let go early for a short hop),
  // hang for a moment at the top, then fall a little quicker than the rise.
  if (!dan.onGround) {
    let g = dan.vy < 0 ? (jumpHeld ? 0.26 : 0.65) : 0.36;
    if (Math.abs(dan.vy) < 1) g *= 0.45;
    dan.vy = Math.min(dan.vy + g, 6.5);
    dan.y += dan.vy;
    if (dan.y >= GROUND_Y - 30) {
      dan.y = GROUND_Y - 30; dan.vy = 0; dan.onGround = true; landTimer = 6;
      if (t - bufferedAt <= 8 && jumpHeld) jump();   // pressed just before landing
    }
  }

  // wind: nothing at the start, then faint streaks that build as the speed climbs
  const gust = Math.max(0, Math.min(1, (speed - 3.6) / 3));
  if (Math.random() < gust * 0.45) {
    wind.push({ x: W + Math.random() * 20, y: 14 + Math.random() * 118,
                len: 6 + Math.random() * 10 + gust * 10, vx: speed * 2.4 + 2 + Math.random() * 2,
                a: 0.07 + 0.16 * gust * Math.random() + 0.05 });
  }
  for (const w of wind) w.x -= w.vx;
  wind = wind.filter(w => w.x + w.len > 0);

  // about 10 frames a second, picking up gently to about 14 at top speed
  if (dan.onGround) runClock += 0.16 * Math.sqrt(speed / 2.4);
  if (landTimer > 0) landTimer--;

  nextGap -= speed;
  if (nextGap <= 0) spawn();

  // pies float at jump height, in gaps between obstacles
  pieGap -= speed;
  if (pieGap <= 0 && secs() < 40 && !obstacles.some(o => o.x > W - 70)) {
    pies.push({ x: W + 4, y: GROUND_Y - 64 });
    pieGap = (1100 + Math.random() * 900) * (1 + 1.5 * difficulty());   // rarer as the run goes on
  }
  for (const p of pies) p.x -= speed;
  pies = pies.filter(p => {
    const got = dan.x + 22 > p.x + 2 && dan.x + 10 < p.x + 16 && dan.y + 4 < p.y + 14 && dan.y + 29 > p.y + 2;
    if (got) { power = POWER_FRAMES; pieFlash = 70; }
    return !got && p.x > -20;
  });
  if (power > 0) power--;
  if (pieFlash > 0) pieFlash--;
  for (const o of obstacles) {
    o.x -= speed + (o.kind.walk || 0);
    if (o.kind.bob) o.y = o.baseY + Math.round(Math.sin((t + o.phase) / 12) * o.kind.bob);
  }
  obstacles = obstacles.filter(o => o.x + o.w > -4);

  for (const o of obstacles) {
    if (o.hurt || !hit(o)) continue;
    // coming down on top of something: bounce off it and score 5 (once per obstacle)
    const feetBefore = dan.y + 29 - dan.vy;
    if (dan.vy > 0 && feetBefore <= o.y + 6) {
      dan.y = o.y - 30;
      dan.vy = -4.2;
      if (!o.stomped) {
        o.stomped = true;
        bonus += 5;
        popups.push({ x: o.x + o.w / 2, y: o.y - 4, t: 45, colour: STOMP_COLOURS[stomps++ % STOMP_COLOURS.length] });
      }
      continue;
    }
    if (invuln > 0) continue;                       // just lost a life: flashing, can't be hit
    lives--;
    o.hurt = true;                                  // run straight through the thing you hit
    if (lives > 0) {
      invuln = 90;                                  // 1.5 seconds to recover
      popups.push({ x: dan.x + 16, y: dan.y - 4, t: 50, label: "-1", colour: "#ff6b6b" });
      continue;
    }
    state = "crash";
    crashAt = performance.now();
    break;
  }
}

// ----------------------------------------------------------------- drawing
function tileLayer(img, offset) {
  const o = Math.floor(offset) % W;
  ctx.drawImage(img, -o, 0);
  ctx.drawImage(img, W - o, 0);
}

// One scrolling layer of the world, drawn tile by tile: each area's tiles, with the in-between
// piece on the tile where the next area starts. `zones` are the area tiles, `trans` the pieces.
function worldLayer(zones, trans, speed, starts) {
  const o = Math.floor(distance * speed);
  for (let k = Math.floor(o / W); k * W - o < W; k++) {
    const x0 = k * W;
    let img = zones[0];
    for (let z = 0; z < starts.length; z++) {
      if (x0 === starts[z]) { img = trans[z]; break; }
      if (x0 > starts[z]) img = zones[z + 1];
    }
    ctx.drawImage(img, x0 - o, 0);
  }
}

function text(str, x, y, size, colour = "#fff", align = "center", maxWidth) {
  ctx.font = `bold ${size}px ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(18,14,23,0.85)";
  ctx.fillText(str, x + 0.75, y + 0.75, maxWidth);   // drop shadow; maxWidth squeezes long text to fit
  ctx.fillStyle = colour;
  ctx.fillText(str, x, y, maxWidth);
}

const HT_COLOURS = ["#765443", "#c49782", "#657da0", "#566f41", "#8883b5", "#66bfad",
  "#d97e30", "#4f5ba9", "#c45b66", "#603b6a", "#9dbc3e", "#e1a22e",
  "#383d97", "#47984a", "#b2383e", "#e5c41f", "#b85895", "#138aa8"];   // clockwise round the logo

function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(18,14,23,0.82)";
  ctx.fillRect(x, y, w, h);
  ringBorder(x, y, w, h);
}

// A border made of the HT logo's colour segments, running round the panel.
function ringBorder(x, y, w, h) {
  let i = 0;
  const seg = (sx, sy, sw, sh) => { ctx.fillStyle = HT_COLOURS[i++ % 18]; ctx.fillRect(sx, sy, sw, sh); };
  for (let px = x; px < x + w; px += 7) seg(px, y, Math.min(6, x + w - px), 2);
  for (let py = y + 2; py < y + h; py += 7) seg(x + w - 2, py, 2, Math.min(6, y + h - py));
  for (let px = x + w - 2; px > x; px -= 7) seg(Math.max(x, px - 6), y + h - 2, Math.min(6, px - x), 2);
  for (let py = y + h - 2; py > y + 2; py -= 7) seg(x, Math.max(y + 2, py - 6), 2, Math.min(6, py - y - 2));
}

// The HT logo, drawn smoothly (not pixelated): coloured ring, grey ring, "ht" in the middle.
function drawHTLogo(cx, cy, R, withText = true, backdrop = true) {   // backdrop: the discs behind the ring and text
  const sector = (r0, r1, a0, a1, colour) => {
    ctx.beginPath();
    ctx.arc(cx, cy, r1, a0, a1);
    ctx.arc(cx, cy, r0, a1, a0, true);
    ctx.closePath();
    ctx.fillStyle = colour;
    ctx.fill();
  };
  if (backdrop) {
    ctx.beginPath(); ctx.arc(cx, cy, R + 0.6, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.fill();
  }
  for (let k = 0; k < 36; k++) {
    const a0 = (-90 + k * 10 + 0.9) * Math.PI / 180, a1 = (-90 + k * 10 + 9.1) * Math.PI / 180;
    sector(R * 0.8, R, a0, a1, HT_COLOURS[(k >> 1) % 18]);
    const inner = k < 18 ? ["#5b5b5d", "#77777a"][k % 2] : ["#cfd0d2", "#e6e7e8"][k % 2];
    sector(R * 0.6, R * 0.74, a0 + 0.02, a1 - 0.02, inner);
  }
  if (backdrop) {
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.56, 0, Math.PI * 2);
    ctx.fillStyle = "#16141a"; ctx.fill();
  }
  if (!withText) return;
  ctx.font = `bold ${R * 0.62}px "Segoe UI", "Helvetica Neue", Arial, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff";
  ctx.fillText("ht", cx, cy + R * 0.02);
}

// Pie power timer as a mini HT ring: segments switch off as the power runs out.
function drawRingTimer(cx, cy, R, frac) {
  const lit = Math.ceil(36 * frac);
  for (let k = 0; k < 36; k++) {
    ctx.beginPath();
    ctx.arc(cx, cy, R, (-90 + k * 10 + 1.2) * Math.PI / 180, (-90 + k * 10 + 8.8) * Math.PI / 180);
    ctx.strokeStyle = k < lit ? HT_COLOURS[(k >> 1) % 18] : "rgba(255,255,255,0.18)";
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

// A coloured silhouette of a sprite, used for glows (made once per image and colour).
const glowCache = new Map();
function glowOf(img, colour = "#ffd98a") {
  const key = img.src + colour;
  if (!glowCache.has(key)) {
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    const g = c.getContext("2d");
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = "source-in";
    g.fillStyle = colour;
    g.fillRect(0, 0, c.width, c.height);
    glowCache.set(key, c);
  }
  return glowCache.get(key);
}

// Title screen: title and the chosen runner on the left, the HT wheel on the right.
// Left/Right turn the wheel; the chosen runner jogs in the middle of it.
let ringShown = 0;                                        // the wheel's current turn, easing towards the choice

function textSans(str, x, y, size, colour = "#fff", align = "left") {
  ctx.font = `800 ${size}px "Segoe UI", "Helvetica Neue", Arial, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(14,12,20,0.6)";
  ctx.fillText(str, x + 0.6, y + 0.8);
  ctx.fillStyle = colour;
  ctx.fillText(str, x, y);
}

function keycap(x, y, w, label) {                         // a small key drawn like a keyboard key
  ctx.fillStyle = "rgba(255,255,255,0.14)";
  ctx.fillRect(x, y, w, 11);
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fillRect(x, y + 10, w, 1);
  if (label === "<" || label === ">") {
    const cx = x + w / 2, cy = y + 5.5, d = label === "<" ? -1 : 1;
    ctx.beginPath(); ctx.moveTo(cx + 2 * d, cy); ctx.lineTo(cx - 1.5 * d, cy - 2.5); ctx.lineTo(cx - 1.5 * d, cy + 2.5);
    ctx.closePath(); ctx.fillStyle = "#fff"; ctx.fill();
  } else text(label, x + w / 2, y + 5.5, 5, "#fff");
}

function wrapLines(str, max) {
  const lines = [];
  for (const word of str.split(" ")) {
    const last = lines[lines.length - 1];
    if (last && (last + " " + word).length <= max) lines[lines.length - 1] = last + " " + word;
    else lines.push(word);
  }
  return lines;
}

// Idle "breathing": mostly standing, dipping for a moment every second or so.
function idleFrame(id, phase) {
  return IMG[id + ((t + phase) % 64 < 40 ? "_stand" : "_land")];
}

function entryCount() {
  const count = loadSubmissions().length;
  return `${count} ${count === 1 ? "entry" : "entries"}`;
}

function backupStatus() {
  const n = entryCount();
  const at = backupAt ? backupAt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "";
  return {
    on: [`Notepad backup on · ${n}${at ? " · saved " + at : ""}`, "#7fd18b"],
    reconnect: ["Notepad backup paused · choose it again to allow", "#ffb84d"],
    off: [`Notepad backup off · ${n}`, "#ffb84d"],
    unsupported: [`Notepad backup needs Chrome or Edge on a computer · ${n} saved here, export from settings`, "#ffb84d"],
    error: ["Notepad backup failed · choose the file again", "#ff8a8a"],
  }[backupState];
}

// ---- Settings (staff only): Ctrl+Alt+S on the title screen. Up/Down move, Enter selects, Esc closes.
let settingsSel = 0, confirmReset = false, settingsMsg = "", settingsMsgAt = 0;
function settingsNote(msg) { settingsMsg = msg; settingsMsgAt = performance.now(); }
const SETTINGS = [
  { label: () => `Save location: ${backupHandle ? backupHandle.name : "not chosen yet"}`,
    detail: () => backupStatus(),
    run: async () => { await connectBackup(); if (backupState === "on") settingsNote("Saving to the Notepad file."); } },
  { label: () => `Download all entries as a spreadsheet (${entryCount()})`,
    run: () => { exportSubmissions(); settingsNote("Spreadsheet downloaded."); } },
  { label: () => confirmReset ? "Press ENTER again to clear the high scores"
                              : `Reset high scores (${loadScores().length} on the board)`,
    detail: () => ["Names and emails already saved are kept", "#8f8a9e"],
    run: () => {
      if (!confirmReset) { confirmReset = true; return; }
      try { localStorage.removeItem(STORE_KEY); } catch { /* storage blocked */ }
      confirmReset = false;
      settingsNote("High scores cleared.");
    } },
  { label: () => "Back to the game", run: () => { state = "title"; } },
];

function drawSettings() {
  ctx.fillStyle = "rgba(14,12,20,0.75)";
  ctx.fillRect(0, -VIEW_H, W, VIEW_H * 3);
  panel(40, 18, 240, 144);
  textSans("SETTINGS", 54, 32, 11);
  text("for HT staff", 266, 32, 5, "#8f8a9e", "right");
  SETTINGS.forEach((item, i) => {
    const y = 50 + i * 22;
    const chosen = i === settingsSel;
    if (chosen) {
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fillRect(48, y - 2, 224, 18);
      ctx.fillStyle = HT_COLOURS[(i * 5 + 6) % 18];
      ctx.fillRect(48, y - 2, 2, 18);
    }
    const danger = item === SETTINGS[2] && confirmReset;
    text(item.label(), 56, y + 4, 5.5, danger ? "#ff8a8a" : chosen ? "#fff" : "#c9c4d6", "left");
    if (item.detail) { const [d, c] = item.detail(); text(d, 56, y + 11, 4.3, c, "left"); }
  });
  if (settingsMsg && performance.now() - settingsMsgAt < 4000) text(settingsMsg, W / 2, 140, 5.5, "#7fd18b");
  text("UP / DOWN choose · ENTER select · ESC close", W / 2, 152, 4.5, "#8f8a9e");
}

function drawRingSelect() {
  extendWorld();
  // fade the world: dark on the left behind the words, lighter towards the wheel
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "rgba(14,12,20,0.9)");
  g.addColorStop(0.5, "rgba(14,12,20,0.6)");
  g.addColorStop(1, "rgba(14,12,20,0.35)");
  ctx.fillStyle = g;
  ctx.fillRect(0, -VIEW_H, W, VIEW_H * 3);
  centred(() => drawTitleUI());
}

function drawTitleUI() {
  const c = who();

  // title lockup
  drawHTLogo(30, 28, 13, true, false);                    // the logo on its own, no discs behind it
  textSans("HT DASH", 50, 24, 17);
  text("an HT Media game", 51, 37, 5, "#b8b3c4", "left");
  for (let i = 0; i < 18; i++) {                          // thin rule in the logo's colours
    ctx.fillStyle = HT_COLOURS[i];
    ctx.fillRect(18 + i * 7, 50, 6, 2);
  }

  // the chosen runner
  text("YOUR RUNNER", 18, 66, 5, "#8f8a9e", "left");
  textSans(c.name, 17, 82, 20, c.colour);
  wrapLines(c.role, 24).forEach((line, i) => text(line, 18, 97 + i * 8, 6, "#e9e4f2", "left"));

  // game stats as little bars in the runner's colour
  [["SPEED", c.speed], ["JUMP", c.jump]].forEach(([label, v], row) => {
    const y = 116 + row * 8;
    text(label, 18, y, 4.5, "#8f8a9e", "left");
    for (let k = 0; k < 5; k++) {
      ctx.fillStyle = k < v ? c.colour : "rgba(255,255,255,0.15)";
      ctx.fillRect(42 + k * 8, y - 2, 7, 4);
    }
  });

  // controls: keys on a laptop, a PLAY button on an iPad
  if (isTouch) {
    text("Swipe or tap a face to choose", 18, 132, 5, "#b8b3c4", "left");
    ctx.fillStyle = c.colour;
    ctx.fillRect(PLAY_BTN.x, PLAY_BTN.y, PLAY_BTN.w, PLAY_BTN.h);
    ctx.fillStyle = "rgba(14,12,20,0.25)";
    ctx.fillRect(PLAY_BTN.x, PLAY_BTN.y + PLAY_BTN.h - 2, PLAY_BTN.w, 2);
    textSans("PLAY", PLAY_BTN.x + PLAY_BTN.w / 2, PLAY_BTN.y + 9, 9, "#fff", "center");
  } else {
    keycap(18, 134, 12, "<"); keycap(32, 134, 12, ">");
    text("choose", 50, 139.5, 5.5, "#b8b3c4", "left");
    keycap(18, 149, 30, "SPACE");
    text("play", 54, 154.5, 5.5, c.colour, "left");
  }
  if (logoHold) {                                          // staff holding the logo: fill a ring
    const k = Math.min(1, (performance.now() - logoHold) / 3000);
    ctx.beginPath(); ctx.arc(30, 28, 15.5, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // best score, small
  const top = loadScores()[0];
  text(top ? `BEST  ${top.name}  ${top.score}` : "No scores yet. Be the first!", 18, 171, 5, "#8f8a9e", "left");

  // staff status: is the Notepad backup working? (Ctrl+Alt+S opens settings)
  const status = backupStatus();
  // staff line, bottom right: short on touchscreens, and squeezed so it never runs off the screen
  const staff = isTouch ? `${entryCount()} saved · hold the logo for settings` : `${status[0]} · Ctrl+Alt+S settings`;
  atScreenTop(() => text(staff, W - 6, VIEW_H - 5, 3.6, isTouch ? "#b8b3c4" : status[1], "right", 150));

  // the wheel
  const cx = 228, cy = 88, R = 68;
  const diff = ((sel * 60 - ringShown) % 360 + 540) % 360 - 180;   // shortest way round
  ringShown += diff * 0.18;
  ctx.beginPath(); ctx.arc(cx, cy, R + 4, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(14,12,20,0.35)"; ctx.fill();      // soft shadow under the wheel
  drawHTLogo(cx, cy, R, false);
  // chosen runner, twice size, with a little idle bob (body dips, feet stay put) and a soft shadow
  ctx.beginPath(); ctx.ellipse(cx, cy + 30, 15, 2.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fill();
  ctx.drawImage(idleFrame(c.id, 0), cx - 32, cy - 30, 64, 64);
  facePos = [];
  CHARS.forEach((p, i) => {
    const a = (-90 + i * 60 - ringShown) * Math.PI / 180;
    const fx = Math.round(cx + R * 0.9 * Math.cos(a));
    const fy = Math.round(cy + R * 0.9 * Math.sin(a) + Math.sin(t / 18 + i * 1.7) * 1.5);   // each face bobs, out of step
    const chosen = i === sel;
    facePos[i] = { x: fx, y: fy };                       // for tapping a face on an iPad
    ctx.beginPath(); ctx.arc(fx, fy, chosen ? 13 : 10.5, 0, Math.PI * 2);
    ctx.fillStyle = "#16141a"; ctx.fill();
    ctx.lineWidth = chosen ? 2 : 1;
    ctx.strokeStyle = chosen ? c.colour : "rgba(255,255,255,0.35)";
    ctx.stroke();
    const k = chosen ? 1.3 : 1;
    ctx.drawImage(IMG[p.id + "_stand"], 8, 0, 16, 16, Math.round(fx - 8 * k), Math.round(fy - 8 * k), 16 * k, 16 * k);
  });
}

function drawWorld() {
  const turbine = Math.floor(t / 6) % 4;
  ctx.drawImage(IMG.sky, 0, 0);
  tileLayer(IMG.clouds, t * 0.05 + distance * 0.02);
  // the small white plane crosses the sky every so often
  const px = (t * 0.35) % (W + 600) - 40;
  if (px < W + 10) ctx.drawImage(IMG.plane, Math.round(px), Math.round(38 + Math.sin(t / 40) * 2));
  const zs = state === "title" || state === "settings" || !zoneStarts ? { mid: [], ground: [] } : zoneStarts;
  // far distance: fades from one area to the next over 3 seconds as the ground changes
  const farTiles = [IMG["far_" + turbine], IMG["port_far_" + turbine], IMG.canal_far];
  const farOffset = Math.floor(distance * LAYER_SPEED.far);
  let farZone = 0, farFade = 0;
  if (state !== "title" && state !== "settings" && zoneStarts) {
    ZONE_AT.forEach((at, i) => {
      const k = Math.max(0, Math.min(1, (secs() - at - 1.5) / 3));
      if (k > 0) { farZone = i; farFade = k; }
    });
    if (farFade >= 1) { farZone++; farFade = 0; }
  }
  tileLayer(farTiles[farZone], farOffset);
  if (farFade > 0) {
    ctx.globalAlpha = farFade;
    tileLayer(farTiles[farZone + 1], farOffset);
    ctx.globalAlpha = 1;
  }
  worldLayer([IMG["mid_" + turbine], IMG.port_mid, IMG.canal_mid],
             [IMG["trans_mid_" + turbine], IMG.trans2_mid], LAYER_SPEED.mid, zs.mid);
  worldLayer([IMG.ground, IMG.port_ground, IMG.canal_ground],
             [IMG.trans_ground, IMG.trans2_ground], LAYER_SPEED.ground, zs.ground);

  for (const w of wind) {
    ctx.fillStyle = `rgba(255,255,255,${w.a.toFixed(3)})`;
    ctx.fillRect(Math.round(w.x), Math.round(w.y), Math.round(w.len), 1);
  }
  for (const p of (state === "play" || state === "crash") ? pies : []) {
    ctx.drawImage(IMG.pie, Math.round(p.x), Math.round(p.y + Math.sin(t / 10) * 1.5));
  }
  for (const o of obstacles || []) {
    const f = o.kind.frames;
    const im = IMG[f[Math.floor(t / (o.kind.blink || o.kind.spin || 10)) % f.length]];
    if (o.kind.air !== undefined) {
      // flying things glow so they stand out against the sky
      const glow = glowOf(im, "#fff3b0");
      for (const [ring, alpha] of [[2, 0.3], [1, 0.75]]) {
        ctx.globalAlpha = alpha * (0.8 + 0.2 * Math.sin(t / 6));
        for (const [gx, gy] of [[-ring, 0], [ring, 0], [0, -ring], [0, ring]]) ctx.drawImage(glow, Math.round(o.x) + gx, o.y + gy);
      }
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(im, Math.round(o.x), o.y);
  }

  // Dan
  if (state === "title" || state === "settings") { drawRingSelect(); return; }
  const menu = state === "board" || state === "name";
  const d = menu ? { x: 18, y: GROUND_Y - 30, onGround: true } : dan;
  const id = who().id;
  let danImg = IMG[id + "_stand"];
  if (state === "play") {
    if (!d.onGround) danImg = d.vy < 0 ? IMG[id + "_jump_up"] : IMG[id + "_jump_down"];   // fist up, then arms out
    else if (landTimer > 0) danImg = IMG[id + "_land"];
    else danImg = IMG[id + "_run_" + Math.floor(runClock) % RUN_FRAMES];
  } else if (state === "board") {
    danImg = idleFrame(id, 0);
  }
  if (power > 0 && (state === "play" || state === "crash") && (power > 120 || Math.floor(t / 6) % 2)) {
    // superhero cape while pie power lasts (it flickers in the last two seconds)
    const cape = !d.onGround ? (d.vy < 0 ? IMG.cape_up : IMG.cape_down) : IMG["cape_run_" + Math.floor(t / 6) % 2];
    ctx.drawImage(cape, Math.round(d.x - 6), Math.round(d.y + 5));
  }
  if (power > 0 && (state === "play" || state === "crash")) {
    // subtle golden glow round Dan while he's super, gently pulsing
    ctx.globalAlpha = 0.35 + 0.15 * Math.sin(t / 8);
    const glow = glowOf(danImg);
    for (const [gx, gy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) ctx.drawImage(glow, Math.round(d.x) + gx, Math.round(d.y) + gy);
    ctx.globalAlpha = 1;
  }
  if (!(state === "play" && invuln > 0 && Math.floor(t / 4) % 2)) ctx.drawImage(danImg, Math.round(d.x), Math.round(d.y));
}

// A little pixel heart for the lives counter.
function heart(x, y, full) {
  ctx.fillStyle = full ? "#e43b44" : "rgba(255,255,255,0.25)";
  for (const [dx, dy, w] of [[1, 0, 2], [4, 0, 2], [0, 1, 7], [0, 2, 7], [1, 3, 5], [2, 4, 3], [3, 5, 1]]) ctx.fillRect(x + dx, y + dy, w, 1);
  if (full) { ctx.fillStyle = "#ff9aa0"; ctx.fillRect(x + 1, y + 1, 1, 1); }
}

function drawHud() {
  for (const p of popups) {                                  // "+5" floating up from a stomped obstacle
    ctx.globalAlpha = Math.min(1, p.t / 15);
    text(p.label || "+5", p.x, p.y, 9, p.colour || who().colour);
    ctx.globalAlpha = 1;
  }
  if (pieFlash > 0) text("PIE POWER! SUPER JUMP!", W / 2, 50, 10, "#ffd98a");
  atScreenTop(drawTopBar);
}

// Hearts, pie timer and score: pinned to the top corners of the actual screen.
function drawTopBar() {
  for (let i = 0; i < LIVES; i++) heart(8 + i * 10, 8, i < lives);
  if (power > 0) {
    // pie power timer, top centre: a mini HT ring whose segments switch off as it runs out
    if (power > 120 || Math.floor(t / 8) % 2) {
      ctx.beginPath(); ctx.arc(W / 2, 17, 13, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(18,14,23,0.75)"; ctx.fill();
      drawRingTimer(W / 2, 17, 11, power / POWER_FRAMES);
      ctx.drawImage(IMG.pie, W / 2 - 9, 10);
    }
  }
  text(`SCORE ${String(score).padStart(5, "0")}`, W - 6, 10, 8, "#fff", "right");
  text(`BEST ${String(Math.max(bestScore(), score)).padStart(5, "0")}`, W - 6, 20, 7, "#ffe2b0", "right");
}

// ----------------------------------------------------------------- clapperboard
const CHALK = "#f2efe6", SLATE = "#1d1b22", CHALK_DIM = "#8f8a99";
let stripeCache = null;
function stripes(w, h) {
  // black and white diagonal blocks, like the top of a film clapper
  if (stripeCache && stripeCache.width === w && stripeCache.height === h) return stripeCache;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) {
    g.fillStyle = Math.floor((x + y) / 8) % 2 ? "#f4f4f4" : "#16141a";
    g.fillRect(x, y, 1, 1);
  }
  stripeCache = c;
  return c;
}

function label(str, x, y) {
  ctx.font = 'bold 5px ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace';
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillStyle = CHALK_DIM;
  ctx.fillText(str, x, y);
}

function chalkLine(x0, y0, x1, y1) {
  ctx.fillStyle = CHALK;
  if (y0 === y1) ctx.fillRect(x0, y0, x1 - x0, 1);
  else ctx.fillRect(x0, y0, 1, y1 - y0);
}

// Slate with its striped clapper. `clap` runs from 0 (open) to 1 (snapped shut).
function slate(x, y, w, h, clap) {
  ctx.fillStyle = "rgba(18,14,23,0.45)";
  ctx.fillRect(x + 3, y + 12, w, h - 9);              // drop shadow
  ctx.fillStyle = SLATE;
  ctx.fillRect(x, y + 9, w, h - 9);                    // the board
  ctx.drawImage(stripes(w, 8), x, y + 10);             // fixed striped bar
  ctx.save();                                          // hinged clapper stick
  ctx.translate(x, y + 9);
  ctx.rotate(-0.5 * (1 - clap));
  ctx.drawImage(stripes(w, 8), 0, -9);
  ctx.restore();
  ctx.fillStyle = "#8f8a99";
  ctx.fillRect(x, y + 1, 4, 17);                       // hinge
  ctx.strokeStyle = CHALK;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 3.5, y + 21.5, w - 7, h - 25);    // chalk frame
}


function drawScoreSlate() {
  const x = 66, w = 188, h = 150, y = 6;
  slate(x, y, w, h, 1);
  const L = x + 4, R = x + w - 4, top = y + 22;
  label(`TAKE ${take}`, L + 3, top + 2);
  text(boardRank >= 0 ? `You're number ${boardRank + 1}!` : "Nice try!", W / 2, top + 11, 10, "#ffd98a");
  chalkLine(L, top + 19, R);
  label("HIGH SCORES", L + 3, top + 22);
  drawTable(x + 44, top + 33, boardRank);
  if (Math.floor(t / 30) % 2 === 0) text("PRESS SPACE TO PLAY AGAIN", W / 2, 168, 8, "#fff");
}

function drawTable(x, y, highlight) {
  const list = loadScores();
  if (!list.length) {
    text("No scores yet. Be the first!", W / 2, y + 20, 7, "#ffe2b0");
    return;
  }
  list.forEach((e, i) => {
    const row = y + i * 9;
    const runner = CHARS.find(c => c.id === e.runner);
    const colour = runner ? runner.colour : "#fff";          // each name in their runner's colour
    const mine = i === highlight;
    text(`${String(i + 1).padStart(2, " ")}.`, x, row, 7, mine ? "#fff" : "#b8b3c4", "right");
    text(e.name, x + 6, row, 7, colour, "left");
    text(String(e.score) + (mine ? " <" : ""), x + 120 + (mine ? 9 : 0), row, 7, mine ? "#fff" : "#b8b3c4", "right");
  });
}

function draw() {
  ctx.setTransform(S, 0, 0, S, 0, OFF_Y * S);              // the world sits in the middle of the view
  ctx.imageSmoothingEnabled = false;
  drawWorld();
  if (state !== "title" && state !== "settings") extendWorld();

  if (state === "play" || state === "crash") drawHud();

  ctx.save();
  ctx.translate(0, -UI_SHIFT);                              // menus and cards sit centred on screen
  if (state === "crash") {
    text("AHH, SHITE!", W / 2, 60, 18, "#ff6b6b");
  }

  if (state === "name") {
    panel(50, 14, 220, 150);
    text("GAME OVER", W / 2, 28, 14, who().colour);
    text(`You scored ${score}`, W / 2, 43, 9, "#fff");
    const cursor = Math.floor(t / 20) % 2 === 0 ? "_" : " ";
    const box = (label, value, y, active, hint) => {
      text(label, 76, y - 7, 6, active ? "#ffe2b0" : "#8a8494", "left");
      ctx.fillStyle = active ? who().colour : "#5a5466";
      ctx.fillRect(74, y, 172, 16);
      ctx.fillStyle = "#120e17";
      ctx.fillRect(75, y + 1, 170, 14);
      const shown = value || (active ? "" : hint);
      text(shown + (active ? cursor : ""), W / 2, y + 8.5, value.length > 26 ? 6 : 8, value ? "#fff" : "#5a5466");
    };
    box("YOUR NAME (shown on the high scores)", nameText, 62, field === "name", "");
    box("WORK EMAIL (never shown on screen)", emailText, 96, field === "email", "name@company.co.uk");
    if (emailError) text("That email doesn't look right. Check it and try again.", W / 2, 122, 6, "#ff8a8a");
    const ready = field === "name" ? nameText.trim() : emailText;
    if (isTouch) {                                         // iPad: tap the boxes to type, then SAVE
      if (!nameText && !emailText) text("Tap a box to type", W / 2, 120.5, 5, "#ffe2b0");
      ctx.fillStyle = nameText.trim() && emailText ? who().colour : "#5a5466";
      ctx.fillRect(SAVE_BTN.x, SAVE_BTN.y, SAVE_BTN.w, SAVE_BTN.h);
      textSans("SAVE", W / 2, SAVE_BTN.y + 7.5, 8, "#fff", "center");
    } else {
      text(field === "name" ? "Press ENTER for the next box" : "Press ENTER to save", W / 2, 136, 7, ready ? "#fff" : "#8a8494");
    }
    text(`We save your email on this ${isTouch ? "device" : "laptop"} for HT Media only.`, W / 2, 148, 5, "#8a8494");
    text("Say hello: info@ht-media.com", W / 2, 157, 6, who().colour);   // HT's contact email
  }
  if (state === "board") drawScoreSlate();
  if (state === "settings") drawSettings();
  ctx.restore();
}

// ----------------------------------------------------------------- input
// Save the name and email (keyboard Enter, the iPad keyboard's return key, or the SAVE button).
function submitEntry() {
  if (!EMAIL_OK.test(emailText)) { emailError = true; return; }
  saveSubmission({ name: nameText.trim(), email: emailText, score, runner: who().id });
  writeBackup();                                                // update the Notepad file too
  boardRank = saveScore(nameText.trim(), score, who().id);     // the table only keeps the name
  obstacles = [];
  boardSince = performance.now();
  state = "board";
  hideTyper();
}

function pressStart() {
  if (state === "title") { newRun(); jumpHeld = false; }
  else if (state === "board") { sel = 0; state = "title"; }       // Dan is the default again
  else if (state === "play") { jumpHeld = true; if (!dan.onGround) bufferedAt = t; jump(); }
}

addEventListener("keydown", e => {
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "b") {      // choose or reconnect the Notepad backup
    connectBackup();
    return;
  }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "e") {      // download every entry as a CSV
    exportSubmissions();
    return;
  }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "s" && (state === "title" || state === "settings")) {
    state = state === "settings" ? "title" : "settings";
    settingsSel = 0; confirmReset = false;
    e.preventDefault();
    return;
  }
  if (state === "settings") {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      settingsSel = (settingsSel + (e.key === "ArrowDown" ? 1 : SETTINGS.length - 1)) % SETTINGS.length;
      confirmReset = false;
    } else if (e.key === "Enter" || e.key === " ") {
      SETTINGS[settingsSel].run();
    } else if (e.key === "Escape") {
      state = "title"; confirmReset = false;
    }
    e.preventDefault();
    return;
  }
  if (state === "name") {
    nameSince = performance.now();
    if (e.target === typer) {                     // typing on the iPad keyboard: the box handles letters
      if (e.key === "Enter" || e.key === "Tab") {
        e.preventDefault();
        if (field === "name" && nameText.trim()) focusTyper("email");
        else if (field === "email") submitEntry();
      }
      return;
    }
    if (field === "name") {
      if ((e.key === "Enter" || e.key === "Tab") && nameText.trim()) field = "email";
      else if (e.key === "Backspace") nameText = nameText.slice(0, -1);
      else if (e.key.length === 1 && /[a-z0-9 .'-]/i.test(e.key) && nameText.length < MAX_NAME) nameText += e.key.toUpperCase();
    } else {
      emailError = false;
      if (e.key === "Enter") {
        submitEntry();
      } else if (e.key === "Backspace") {
        if (emailText) emailText = emailText.slice(0, -1);
        else field = "name";                                          // back to the name box
      } else if (e.key === "Tab") field = "name";
      else if (e.key.length === 1 && /[a-z0-9@._+'-]/i.test(e.key) && emailText.length < MAX_EMAIL) emailText += e.key.toLowerCase();
    }
    e.preventDefault();
    return;
  }
  if (e.key === "f" || e.key === "F") {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
    return;
  }
  if (state === "title" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {   // pick a runner
    e.preventDefault();
    sel = (sel + (e.key === "ArrowRight" ? 1 : CHARS.length - 1)) % CHARS.length;
    return;
  }
  if (e.key === " " && !e.repeat) {
    e.preventDefault();
    pressStart();
  }
});
addEventListener("keyup", e => {
  if (e.key === " ") jumpHeld = false;
});
// ----------------------------------------------------------------- touch (iPad) and mouse
// Title: swipe or tap a face to choose, tap PLAY (or the runner) to start; hold the HT logo for
// 3 seconds for settings. Playing: tap to jump, hold for a big jump. Game over: tap a box to type
// on the iPad keyboard, tap SAVE. Scoreboard: tap to carry on. Settings: tap an option, tap outside to close.
const typer = document.getElementById("typer");
const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
const NAME_BOX = { x: 74, y: 62, w: 172, h: 16 }, EMAIL_BOX = { x: 74, y: 96, w: 172, h: 16 };
const SAVE_BTN = { x: 130, y: 126, w: 60, h: 15 }, PLAY_BTN = { x: 18, y: 138, w: 64, h: 18 };
let facePos = [], downAt = null, logoHold = null;
const inBox = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * VIEW_H - OFF_Y };
}

function placeTyper(box) {                        // lay the invisible text box over the drawn one
  const r = canvas.getBoundingClientRect(), k = r.width / W;
  Object.assign(typer.style, { display: "block", left: r.left + box.x * k + "px", top: r.top + (box.y + OFF_Y - UI_SHIFT) * k + "px",
    width: box.w * k + "px", height: box.h * k + "px" });
}
function focusTyper(which) {
  field = which;
  typer.value = which === "name" ? nameText : emailText;
  typer.inputMode = which === "email" ? "email" : "text";
  typer.type = which === "email" ? "email" : "text";
  typer.setAttribute("autocapitalize", which === "name" ? "characters" : "none");
  typer.setAttribute("enterkeyhint", which === "name" ? "next" : "done");
  placeTyper(which === "name" ? NAME_BOX : EMAIL_BOX);
  typer.focus();
}
function hideTyper() { typer.blur(); typer.style.display = "none"; }
typer.addEventListener("input", () => {
  nameSince = performance.now();
  if (field === "name") {
    nameText = typer.value.toUpperCase().replace(/[^A-Z0-9 .'-]/g, "").slice(0, MAX_NAME);
    typer.value = nameText;
  } else {
    emailError = false;
    emailText = typer.value.toLowerCase().replace(/[^a-z0-9@._+'-]/g, "").slice(0, MAX_EMAIL);
  }
});

canvas.addEventListener("pointerdown", e => {
  canvas.focus();
  const p = toGame(e);
  if (state !== "play") p.y += UI_SHIFT;                    // menus are drawn centred on screen
  downAt = p;
  if (state === "play") { e.preventDefault(); pressStart(); return; }
  if (state === "title" && Math.hypot(p.x - 30, p.y - 28) < 15) logoHold = performance.now();   // staff: hold the logo
});
addEventListener("pointerup", e => {
  jumpHeld = false;
  const p = downAt ? toGame(e) : null;
  if (p && state !== "play") p.y += UI_SHIFT;
  const start = downAt;
  downAt = null;
  if (logoHold) {
    const held = performance.now() - logoHold;
    logoHold = null;
    if (held >= 3000) { state = "settings"; settingsSel = 0; confirmReset = false; return; }
  }
  if (!p || e.target !== canvas) return;
  if (state === "title") {
    if (Math.abs(p.x - start.x) > 25) {                         // swipe to turn the wheel
      sel = (sel + (p.x < start.x ? 1 : CHARS.length - 1)) % CHARS.length;
      return;
    }
    const face = facePos.findIndex(f => Math.hypot(p.x - f.x, p.y - f.y) < 13);
    if (face >= 0) { sel = face; return; }
    if (inBox(p, PLAY_BTN) || Math.hypot(p.x - 228, p.y - 88) < 36) { newRun(); jumpHeld = false; }
  } else if (state === "board") {
    pressStart();
  } else if (state === "name") {
    if (inBox(p, NAME_BOX)) focusTyper("name");
    else if (inBox(p, EMAIL_BOX)) focusTyper("email");
    else if (inBox(p, SAVE_BTN)) { if (!nameText.trim()) focusTyper("name"); else submitEntry(); }
  } else if (state === "settings") {
    const row = SETTINGS.findIndex((_, i) => p.x >= 48 && p.x <= 272 && p.y >= 48 + i * 22 && p.y <= 66 + i * 22);
    if (row >= 0) { settingsSel = row; SETTINGS[row].run(); }
    else if (p.x < 40 || p.x > 280 || p.y < 18 || p.y > 162) { state = "title"; confirmReset = false; }
  }
});
addEventListener("resize", () => { if (typer.style.display === "block") placeTyper(field === "name" ? NAME_BOX : EMAIL_BOX); });

// ----------------------------------------------------------------- main loop
// Fixed 60 updates a second, whatever the screen's refresh rate.
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(250, now - last);
  last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(frame);
}

restoreBackup();
navigator.storage?.persist?.();                    // ask the browser to keep saved entries
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});   // works offline once loaded (when hosted)
}
loadAll().then(() => {
  distance = 0; score = 0; obstacles = [];
  requestAnimationFrame(frame);
}).catch(err => {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  text(err.message, W / 2, H / 2, 7, "#ff6b6b");
});
</script>
</body>
</html>
